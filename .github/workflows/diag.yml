name: diag
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separadas por espaço"
        required: true
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar HTML bruto
        env:
          URLS: ${{ inputs.urls }}
        run: |
          git fetch origin diag && git checkout diag || git checkout --orphan diag
          git rm -rfq . || true
          mkdir -p diag; i=0
          for u in $URLS; do
            i=$((i+1))
            curl -sSL -A "Mozilla/5.0 (compatible; leilaomon/0.1; monitor pessoal)" -o "diag/$i.html" -w "$i %{http_code} %{size_download} $u\n" "$u" >> diag/index.txt || echo "$i ERRO $u" >> diag/index.txt
            sleep 2
          done
          cat diag/index.txt
          git config user.name "leilaomon-bot"; git config user.email "bot@users.noreply.github.com"
          git add diag && git commit -qm "diag" && git push -f origin HEAD:diag
