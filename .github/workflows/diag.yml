name: diag
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separadas por espaço"
        required: true
      residencial:
        description: "Rodar no executor da casa"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  diag:
    runs-on: ${{ inputs.residencial && fromJSON('["self-hosted","residencial"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx
      - run: python tools/diag_urls.py "${{ inputs.urls }}"
