name: diag
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separadas por espaço"
        required: false
        default: ""
      script:
        description: "Script de sonda em tools/ (opcional, roda antes)"
        required: false
        default: ""
      residencial:
        description: "Rodar no executor da casa"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  diag:
    runs-on: ${{ inputs.residencial && fromJSON('["self-hosted","residencial"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install httpx truststore
      - if: inputs.script != ''
        continue-on-error: true
        run: python tools/${{ inputs.script }}
      - run: python tools/diag_urls.py "${{ inputs.urls }}"
