name: leilaomon
on:
  schedule:
    - cron: "15 */3 * * *"   # a cada 3 h (UTC)
  workflow_dispatch:
    inputs:
      seco:
        description: "Só simular notificações"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: leilaomon

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coletar, avaliar e notificar
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          FIPE_TOKEN: ${{ secrets.FIPE_TOKEN }}
        run: |
          set -o pipefail
          exec > >(tee ultimo_run.log) 2>&1
          python -m leilaomon coletar
          python -m leilaomon avaliar
          if [ "${{ inputs.seco }}" = "true" ]; then python -m leilaomon notificar --seco; else python -m leilaomon notificar; fi
          python -m leilaomon top -n 15
          python -m leilaomon exportar
      - name: Persistir banco
        if: always()
        run: |
          git config user.name "leilaomon-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f leiloes.db ultimo_run.log diag || true
          git diff --cached --quiet || git commit -m "db $(date -u +%F_%H%M)"
          git pull --rebase -X theirs || true
          git push
      - name: Preparar página
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar página
        id: deploy
        if: always()
        continue-on-error: true
        uses: actions/deploy-pages@v4
